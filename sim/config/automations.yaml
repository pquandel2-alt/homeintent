- id: "1700000000001"
  alias: Flurlicht bei Bewegung
  description: Vom Benutzer angelegt (nicht HomeIntent)
  triggers:
    - trigger: state
      entity_id: binary_sensor.bewegung_flur
      to: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.flurlicht
- id: "1700000000002"
  alias: Rollläden abends schließen
  description: >-
    Vom Benutzer angelegt (nicht HomeIntent). Im Testbett ab 7.9.3 aus
    (initial_state false): ein Testlauf über den Sonnenuntergang hinweg
    schloss sonst zwischen zwei Schritten die Wohnzimmer- und Küchenrollläden
    und verfälschte Rollladen- und Wirkungsszenarien. Die Automation bleibt als
    fremde Benutzer-Automation in der Registry sichtbar.
  initial_state: false
  triggers:
    - trigger: sun
      event: sunset
      offset: "00:15:00"
  actions:
    - action: cover.close_cover
      target:
        entity_id:
          - cover.wohnzimmer_rollladen_links
          - cover.wohnzimmer_rollladen_rechts
          - cover.kuechenrollladen
