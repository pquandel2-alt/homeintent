language: "de"
intents:
  # HomeIntent V5 Teil 8/10, V5.28 "Automation Deletion" - the 17th
  # separately-compiled hassil grammar (see parsers.py's
  # AutomationDeleteParser docstring). DELETE only, not DISABLE/ENABLE: the
  # plan text explicitly names these as different operations - see
  # intents/de/automation_toggle/automation_toggle.yaml (Wave 11, the 18th
  # grammar) for that operation's own YAML-mutating ``initial_state``
  # mechanism, distinct from this file's delete path.
  #
  # {name} is mandatory here (unlike automation_query.yaml's bare "welche
  # automationen gibt es") - a target-less "lösche die automation" would
  # mean "delete all of them", which this integration must never guess
  # (Regel 4). Identifies the automation to delete by which entity it
  # references, the same "entity-filtered" resolution
  # AutomationQueryParser's "was schaltet {name}" already uses - not a
  # second, separately-invented targeting mechanism.
  HassAutomationDelete:
    data:
      - sentences:
          - "lösche die automation für {name}"
          - "lösche die automation {name}"
          - "lösche die automation die {name} schaltet"
          - "lösche die automation die {name} steuert"
          - "entferne die automation für {name}"
          - "entferne die automation {name}"
          - "entferne die automation die {name} schaltet"
          - "entferne die automation die {name} steuert"
