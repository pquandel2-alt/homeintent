language: "de"
intents:
  # HomeIntent V5 Teil 8/10 (Wave 11, "Automation Disable/Enable") - the
  # 18th separately-compiled hassil grammar (see parsers.py's
  # AutomationToggleParser docstring). The plan text names DISABLE/ENABLE
  # as operations distinct from DELETE - unlike a deletion, disabling is
  # trivially reversible (just enable it again), so this path never gates
  # behind a "ja"/"nein" confirmation the way automation_delete.yaml does;
  # it executes immediately, the same way an ordinary TURN_ON/TURN_OFF
  # command already does.
  #
  # {name} is mandatory here, same "never guess a target-less bulk
  # operation" reasoning automation_delete.yaml's own docstring already
  # gives - a target-less "deaktiviere die automation" must never be read
  # as "disable all of them". Identifies the automation the same
  # entity-filtered way AutomationDeleteParser/AutomationQueryParser
  # already do - not a third, separately-invented targeting mechanism
  # (Regel 6).
  HassAutomationDisable:
    data:
      - sentences:
          # 7.9.1 A5: the object forms of the monitor language - short
          # imperatives, "aus" particles, modal frames, prepositions.
          - "(deaktiviere|deaktivier|stoppe|stopp|beende) die automation [(für|fürs|vom|von|zum|zur|für das|für die|für den)] {name}"
          - "(deaktiviere|deaktivier) die automation die {name} (schaltet|steuert)"
          - "(schalte|schalt) die automation [(für|fürs|vom|von|zum|zur|für das|für die|für den)] {name} aus"
          - "(kannst|könntest) du die automation [(für|fürs|vom|von|zum|zur|für das|für die|für den)] {name} (deaktivieren|ausschalten|stoppen|abschalten)"
  HassAutomationEnable:
    data:
      - sentences:
          - "(aktiviere|aktivier) die automation [(für|fürs|vom|von|zum|zur|für das|für die|für den)] {name}"
          - "(aktiviere|aktivier) die automation die {name} (schaltet|steuert)"
          - "(schalte|schalt) die automation [(für|fürs|vom|von|zum|zur|für das|für die|für den)] {name} (ein|an)"
          - "(kannst|könntest) du die automation [(für|fürs|vom|von|zum|zur|für das|für die|für den)] {name} (aktivieren|einschalten)"
